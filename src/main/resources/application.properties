# ==========================================
# Application
# ==========================================

spring.application.name=${APP_NAME:java-recruiter-outreach}

server.port=${PORT:6041}
server.servlet.context-path=${CONTEXT_PATH:/recruiter-outreach}


# ==========================================
# Gmail SMTP
# ==========================================

spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}

spring.mail.username=${SMTP_USERNAME:faisal.dev.ali@gmail.com}
spring.mail.password=${SMTP_PASSWORD:}

spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS_ENABLE:true}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS_REQUIRED:true}

spring.mail.properties.mail.smtp.connectiontimeout=${SMTP_CONNECTION_TIMEOUT:10000}
spring.mail.properties.mail.smtp.timeout=${SMTP_TIMEOUT:10000}
spring.mail.properties.mail.smtp.writetimeout=${SMTP_WRITE_TIMEOUT:10000}


# ==========================================
# Outreach Configuration
# ==========================================

outreach.resume-path=${OUTREACH_RESUME_PATH:classpath:resume/Faisal_Ali_Software_Engineer_Resume.pdf}

outreach.log-path=${OUTREACH_LOG_PATH:outreach-log.csv}

outreach.dry-run=${OUTREACH_DRY_RUN:false}

outreach.sender-name=${OUTREACH_SENDER_NAME:Faisal Ali}


# ==========================================
# OpenAPI / Swagger
# ==========================================

springdoc.api-docs.path=${OPENAPI_PATH:/v3/api-docs}

springdoc.swagger-ui.path=${SWAGGER_PATH:/swagger-ui.html}

springdoc.swagger-ui.operations-sorter=${SWAGGER_OPERATIONS_SORTER:method}

springdoc.swagger-ui.tags-sorter=${SWAGGER_TAGS_SORTER:alpha}